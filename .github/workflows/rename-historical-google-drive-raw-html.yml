name: Rename historical Google Drive raw HTML files

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Dry run or rename files
        required: true
        type: choice
        options: [dry_run, execute]
        default: dry_run
      confirmation:
        description: Required for execute mode
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: historical-google-drive-raw-html-renaming
  cancel-in-progress: false

jobs:
  rename:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check Google Drive secrets
        run: |
          missing=0
          for name in GOOGLE_DRIVE_CLIENT_ID GOOGLE_DRIVE_CLIENT_SECRET GOOGLE_DRIVE_REFRESH_TOKEN GOOGLE_DRIVE_ROOT_FOLDER_ID; do
            if [[ -n "${!name:-}" ]]; then echo "$name=set"; else echo "$name=missing"; missing=1; fi
          done
          exit "$missing"
      - name: Check execute confirmation
        if: inputs.mode == 'execute'
        run: test "${{ inputs.confirmation }}" = "RENAME_HISTORICAL_HTML_2006_2019"
      - name: Rename historical files through Drive API
        run: |
          python scripts/rename_google_drive_raw_html.py \
            --years 2019,2018,2017,2016,2015,2014,2013,2012,2011,2010,2009,2008,2007,2006 \
            --drive-root-folder-id "$GOOGLE_DRIVE_ROOT_FOLDER_ID" \
            --mode "${{ inputs.mode }}" --historical --repo-root . \
            --output-dir google_drive_historical_rename
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-drive-historical-rename-${{ inputs.mode }}
          path: google_drive_historical_rename/
          if-no-files-found: error
          retention-days: 30
