name: Apply plain-text 10-K parser fix

on:
  push:
    branches:
      - fix/plain-text-10k-fallback

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/plain-text-10k-fallback
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply parser fallback and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          parser_path = Path("scripts/parse_sec_10k_html.py")
          source = parser_path.read_text(encoding="utf-8")
          old_version = 'PARSER_VERSION = "1.0.4"'
          if old_version not in source:
              raise SystemExit("expected parser version marker is missing")
          source = source.replace(old_version, 'PARSER_VERSION = "1.0.5"', 1)

          marker = "\ndef parse_html(payload: bytes) -> dict:\n"
          if source.count(marker) != 1:
              raise SystemExit("parse_html marker is not unique")

          helper = r'''

PLAIN_TEXT_HTML_BLOCK = re.compile(
    r"<\s*(?:html|body|p|div|tr|td|th|h[1-6]|ul|ol|li)\b",
    re.I,
)
PLAIN_TEXT_METADATA_LINE = re.compile(
    r"^\s*<(?:TYPE|SEQUENCE|FILENAME|DESCRIPTION)>.*$",
    re.I,
)
PLAIN_TEXT_CONTROL_LINE = re.compile(
    r"^\s*</?(?:DOCUMENT|TEXT|PAGE)>\s*$",
    re.I,
)
PLAIN_TEXT_TABLE_START = "__SEC_TABLE_START__"
PLAIN_TEXT_TABLE_END = "__SEC_TABLE_END__"


def decode_filing_payload(payload: bytes) -> str:
    for encoding in ("utf-8", "cp1252", "latin-1"):
        try:
            return payload.decode(encoding)
        except UnicodeDecodeError:
            continue
    return payload.decode("utf-8", errors="replace")


def is_probably_plain_text_filing(payload: bytes) -> bool:
    decoded = decode_filing_payload(payload).replace("\x00", "")
    words = re.findall(r"[A-Za-z][A-Za-z0-9'’-]*", decoded)
    if len(words) < 100:
        return False
    html_block_count = len(PLAIN_TEXT_HTML_BLOCK.findall(decoded))
    has_sec_sgml = bool(
        re.search(
            r"(?im)^\s*<(?:DOCUMENT|TYPE|SEQUENCE|FILENAME|DESCRIPTION|TEXT)>",
            decoded,
        )
    )
    return html_block_count < 8 and (has_sec_sgml or decoded.count("\n") >= 10)


def plain_text_table_like(lines: list[str]) -> bool:
    if len(lines) < 2:
        return False
    text = "\n".join(lines)
    tokens = re.findall(r"\S+", text)
    if not tokens:
        return False
    numeric_tokens = sum(
        bool(re.fullmatch(r"[$(]?[-+]?\d[\d,]*(?:\.\d+)?%?[)]?", token))
        for token in tokens
    )
    numeric_ratio = numeric_tokens / len(tokens)
    column_lines = sum(
        bool(re.search(r"\S(?:\s{2,}|\t+)\S", line)) for line in lines
    )
    return (
        column_lines >= max(2, len(lines) // 2) and numeric_ratio >= 0.15
    ) or numeric_ratio >= 0.50


def extract_plain_text_blocks(
    payload: bytes,
) -> tuple[list[TextBlock], list[str], int]:
    body = decode_filing_payload(payload).replace("\x00", "")
    text_match = re.search(r"(?is)<TEXT[^>]*>(.*?)</TEXT>", body)
    if text_match:
        body = text_match.group(1)
    body = re.sub(
        r"(?i)<TABLE(?:\s[^>]*)?>",
        f"\n{PLAIN_TEXT_TABLE_START}\n",
        body,
    )
    body = re.sub(
        r"(?i)</TABLE>",
        f"\n{PLAIN_TEXT_TABLE_END}\n",
        body,
    )
    body = re.sub(r"(?i)</?PAGE[^>]*>", "\n\n", body)
    retained_lines = []
    for line in body.replace("\r\n", "\n").replace("\r", "\n").split("\n"):
        if PLAIN_TEXT_METADATA_LINE.match(line) or PLAIN_TEXT_CONTROL_LINE.match(line):
            continue
        retained_lines.append(line)
    body = "\n".join(retained_lines)
    body = re.sub(r"<[^>\r\n]+>", " ", body)
    body = html_module.unescape(body)
    body = unicodedata.normalize("NFKC", body)
    body = body.replace("\xa0", " ").replace("\u00ad", "")
    body = ZERO_WIDTH.sub("", body)

    groups: list[tuple[bool, list[str]]] = []
    buffer: list[str] = []
    buffer_table = False
    in_table = False

    def flush() -> None:
        nonlocal buffer
        if buffer:
            groups.append((buffer_table, buffer))
            buffer = []

    for raw_line in body.splitlines():
        stripped = raw_line.strip()
        if stripped == PLAIN_TEXT_TABLE_START:
            flush()
            in_table = True
            buffer_table = True
            continue
        if stripped == PLAIN_TEXT_TABLE_END:
            flush()
            in_table = False
            buffer_table = False
            continue
        cleaned = SPACE.sub(" ", stripped).strip()
        if not cleaned:
            flush()
            continue
        if PAGE_NUMBER.fullmatch(cleaned):
            flush()
            continue
        if not in_table and ITEM_PATTERN.match(cleaned):
            flush()
            groups.append((False, [cleaned]))
            continue
        uppercase_heading = (
            not in_table
            and len(cleaned) <= 140
            and any(character.isalpha() for character in cleaned)
            and cleaned == cleaned.upper()
        )
        if uppercase_heading:
            flush()
            groups.append((False, [cleaned]))
            continue
        if buffer and buffer_table != in_table:
            flush()
        buffer_table = in_table
        buffer.append(raw_line.rstrip())
    flush()

    blocks: list[TextBlock] = []
    table_texts: list[str] = []
    duplicates = 0
    previous = ""
    for explicit_table, lines in groups:
        text = normalize_text("\n".join(lines))
        if not text:
            continue
        if text.lower() in {"table of contents", "end privacy-enhanced message"}:
            continue
        canonical = re.sub(r"\s+", " ", text).strip()
        if canonical == previous:
            duplicates += 1
            continue
        previous = canonical
        is_table = explicit_table or plain_text_table_like(lines)
        table_number = 0
        if is_table:
            table_texts.append(text)
            table_number = len(table_texts)
        blocks.append(
            TextBlock(
                order=len(blocks) + 1,
                text=text,
                source_element="plain_text",
                is_heading=(
                    bool(ITEM_PATTERN.match(text[:300]))
                    or (
                        len(text) <= 140
                        and any(character.isalpha() for character in text)
                        and text == text.upper()
                    )
                ),
                is_table=is_table,
                table_number=table_number,
            )
        )
    return blocks, table_texts, duplicates
'''
          source = source.replace(marker, helper + marker, 1)

          old_parse = '''def parse_html(payload: bytes) -> dict:
    parser = html.HTMLParser(encoding="utf-8", recover=True, huge_tree=True)
    root = html.fromstring(payload, parser=parser)
    root, table_texts = clean_tree(root)
    blocks, duplicates = extract_blocks(root, table_texts)
    sections = detect_sections(blocks)
    return {
        "blocks": blocks,
        "table_texts": table_texts,
        "sections": sections,
        "duplicate_blocks_removed": duplicates,
    }
'''
          new_parse = '''def parse_html(payload: bytes) -> dict:
    if is_probably_plain_text_filing(payload):
        plain_blocks, plain_tables, plain_duplicates = extract_plain_text_blocks(payload)
        plain_words = sum(
            len(block.text.split()) for block in plain_blocks if not block.is_table
        )
        if plain_words >= 100:
            sections = detect_sections(plain_blocks)
            return {
                "blocks": plain_blocks,
                "table_texts": plain_tables,
                "sections": sections,
                "duplicate_blocks_removed": plain_duplicates,
            }

    parser = html.HTMLParser(encoding="utf-8", recover=True, huge_tree=True)
    root = html.fromstring(payload, parser=parser)
    root, table_texts = clean_tree(root)
    blocks, duplicates = extract_blocks(root, table_texts)
    sections = detect_sections(blocks)
    return {
        "blocks": blocks,
        "table_texts": table_texts,
        "sections": sections,
        "duplicate_blocks_removed": duplicates,
    }
'''
          if old_parse not in source:
              raise SystemExit("expected parse_html implementation is missing")
          source = source.replace(old_parse, new_parse, 1)
          parser_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/test_plain_text_10k_parser.py")
          test_path.write_text(r'''from __future__ import annotations

import sys
from pathlib import Path

sys.path.insert(0, str(Path(__file__).resolve().parents[1] / "scripts"))

from extract_10k_analysis_text import parse_with_retries  # noqa: E402
from parse_sec_10k_html import PARSER_VERSION, parse_html  # noqa: E402


def plain_text_fixture() -> bytes:
    business = " ".join(
        [
            "Empire Petroleum develops and manages oil and gas properties while evaluating operating risks and capital requirements."
            for _ in range(18)
        ]
    )
    risks = " ".join(
        [
            "Our operations depend on commodity prices, available financing, regulatory approvals, and successful drilling activity."
            for _ in range(12)
        ]
    )
    discussion = " ".join(
        [
            "Management reviews liquidity, operating expenses, production activity, and future development plans for each reporting period."
            for _ in range(12)
        ]
    )
    return f'''<DOCUMENT>
<TYPE>10-K
<SEQUENCE>1
<FILENAME>r10k-2010.txt
<DESCRIPTION>FORM 10-K
<TEXT>
UNITED STATES SECURITIES AND EXCHANGE COMMISSION
FORM 10-K

ITEM 1. BUSINESS
{business}

<TABLE>
Year      Revenue      Expense
2010      100          80
2009      90           75
</TABLE>

ITEM 1A. RISK FACTORS
{risks}

ITEM 7. MANAGEMENT'S DISCUSSION AND ANALYSIS
{discussion}

ITEM 8. FINANCIAL STATEMENTS AND SUPPLEMENTARY DATA
The audited financial statements follow in the filing.
</TEXT>
</DOCUMENT>
'''.encode("utf-8")


def test_plain_text_sec_submission_uses_fallback_parser():
    parsed = parse_html(plain_text_fixture())
    narrative = [block for block in parsed["blocks"] if not block.is_table]
    assert PARSER_VERSION == "1.0.5"
    assert sum(len(block.text.split()) for block in narrative) >= 100
    assert any(block.source_element == "plain_text" for block in narrative)
    assert parsed["table_texts"]
    assert any(block.is_table for block in parsed["blocks"])
    assert parsed["sections"]["item_1"]["status"] == "detected"
    assert parsed["sections"]["item_1a"]["status"] == "detected"
    assert parsed["sections"]["item_7"]["status"] == "detected"
    assert parsed["sections"]["item_8"]["status"] == "detected"


def test_plain_text_submission_passes_extraction_retry_guard():
    parsed, attempts, error = parse_with_retries(plain_text_fixture())
    assert parsed is not None
    assert attempts == 1
    assert error == ""
''', encoding="utf-8")

          workflow_path = Path(".github/workflows/test-yearly-runner-generalization.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          workflow = workflow.replace(
              '      - "scripts/extract_10k_analysis_text.py"\n',
              '      - "scripts/extract_10k_analysis_text.py"\n'
              '      - "scripts/parse_sec_10k_html.py"\n'
              '      - "tests/test_plain_text_10k_parser.py"\n',
              1,
          )
          workflow = workflow.replace(
              '            scripts/extract_10k_analysis_text.py \\\n',
              '            scripts/extract_10k_analysis_text.py \\\n'
              '            scripts/parse_sec_10k_html.py \\\n',
              1,
          )
          workflow = workflow.replace(
              '            tests/test_run_yearly_10k_batch_diagnostics.py \\\n'
              '            tests/test_continuous_backfill.py\n',
              '            tests/test_run_yearly_10k_batch_diagnostics.py \\\n'
              '            tests/test_plain_text_10k_parser.py \\\n'
              '            tests/test_continuous_backfill.py\n',
              1,
          )
          workflow = workflow.replace(
              '            tests/test_run_yearly_10k_batch_diagnostics.py\n',
              '            tests/test_run_yearly_10k_batch_diagnostics.py\n'
              '            tests/test_plain_text_10k_parser.py\n',
              1,
          )
          workflow_path.write_text(workflow, encoding="utf-8")
          PY

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Validate patch
        run: |
          python -m py_compile scripts/parse_sec_10k_html.py scripts/extract_10k_analysis_text.py
          pytest -q \
            tests/test_plain_text_10k_parser.py \
            tests/test_yearly_batch_generalization.py \
            tests/test_run_yearly_10k_batch_diagnostics.py \
            tests/test_continuous_backfill.py

      - name: Commit final patch
        run: |
          rm .github/workflows/apply-plain-text-10k-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/parse_sec_10k_html.py tests/test_plain_text_10k_parser.py .github/workflows/test-yearly-runner-generalization.yml .github/workflows/apply-plain-text-10k-fix.yml
          git commit -m "Support legacy plain-text 10-K filings"
          git push origin HEAD:fix/plain-text-10k-fallback
