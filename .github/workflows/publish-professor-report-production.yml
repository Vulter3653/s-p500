name: Publish professor report to production main

on:
  push:
    branches: [main]
    paths:
      - 'web/build_production_professor_report.py'
      - 'web/apply_production_desktop_refinements.py'
      - 'web/tests/professor-figure-integrity.spec.js'
      - '.github/workflows/publish-professor-report-production.yml'

permissions:
  contents: write

jobs:
  publish-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build production professor report
        run: |
          python web/build_production_professor_report.py
          python web/apply_production_desktop_refinements.py

      - name: Validate production HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('web/index.html').read_text(encoding='utf-8')
          assert '5,355' in html
          assert '1,890' in html
          assert 'p&lt;0.001***' in html
          assert '6.11 결과 해석 (Discussion)' in html
          assert '6.12 해석 시 유의사항' not in html
          assert '보정하지 않은' not in html
          assert '보정된 p' not in html
          assert '보정 p' not in html
          assert '변수 해석:' not in html
          assert 'production-figure-series-refinement' in html
          assert 'production-desktop-fit' in html
          assert 'production-dot-to-dot-line-sync-v3' in html
          assert 'data-dot-connector' in html
          assert 'production-gap-safe-line-sync-v2' not in html
          assert 'production-line-dot-sync' not in html
          assert 'Item 1C Cybersecurity</strong> — 최근 3개 연도 중심' not in html
          assert 'Item 8 Financial Statements and Supplementary Data</strong> — 표·주석 중심' not in html
          assert '@media (min-width:1200px)' in html
          print('Production HTML validation PASS')
          PY

      - name: Install web dependencies and validate Vite build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install Chromium for full figure audit
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Commit production report to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/index.html
          if git diff --cached --quiet; then
            echo 'No production HTML changes to commit.'
          else
            git commit -m 'Publish professor report on production main'
            git push origin HEAD:main
          fi

      - name: Wait for Cloudflare production to contain dot-to-dot figure fix
        run: |
          set -euo pipefail
          URL='https://s-p500.pages.dev/'
          for attempt in $(seq 1 24); do
            echo "Production convergence ${attempt}/24"
            if curl --fail --silent --show-error --location --max-time 20 "$URL" -o /tmp/production.html; then
              if grep -q 'production-dot-to-dot-line-sync-v3' /tmp/production.html \
                && grep -q '6.11 결과 해석 (Discussion)' /tmp/production.html \
                && ! grep -q 'production-gap-safe-line-sync-v2' /tmp/production.html; then
                echo 'Cloudflare production convergence PASS'
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'Cloudflare production convergence FAIL'
          exit 1

      - name: Audit all professor figures in production browser
        working-directory: web
        env:
          PLAYWRIGHT_BASE_URL: https://s-p500.pages.dev
        run: npx playwright test tests/professor-figure-integrity.spec.js --reporter=line
