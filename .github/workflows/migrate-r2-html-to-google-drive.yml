name: Migrate R2 raw HTML to Google Drive

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run the one-object connection test or the complete migration
        required: true
        type: choice
        options:
          - test
          - full
        default: test
      drive_layout:
        description: Drive storage layout for future migrations
        required: true
        type: choice
        options:
          - year_flat
          - legacy_nested
        default: year_flat

permissions:
  contents: read

concurrency:
  group: r2-google-drive-raw-html-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: ${{ inputs.mode == 'test' && 'Connection and one-object test' || 'Full raw HTML migration' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Confirm required secrets are injected
        shell: bash
        run: |
          missing=0
          for name in \
            GOOGLE_DRIVE_CLIENT_ID GOOGLE_DRIVE_CLIENT_SECRET \
            GOOGLE_DRIVE_REFRESH_TOKEN GOOGLE_DRIVE_ROOT_FOLDER_ID \
            R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT_URL R2_BUCKET_NAME
          do
            if [[ -n "${!name:-}" ]]; then
              echo "$name=set"
            else
              echo "$name=missing"
              missing=1
            fi
          done
          exit "$missing"

      - name: Run connection and one-object migration test
        if: inputs.mode == 'test'
        run: |
          python scripts/migrate_r2_html_to_google_drive.py \
            --years 2020 \
            --drive-root-folder-id "$GOOGLE_DRIVE_ROOT_FOLDER_ID" \
            --drive-layout "${{ inputs.drive_layout }}" \
            --workers 1 \
            --test-first-object \
            --output-dir google_drive_storage

      - name: Run complete migration
        if: inputs.mode == 'full'
        run: |
          python scripts/migrate_r2_html_to_google_drive.py \
            --years 2020,2021,2022,2023,2024,2025 \
            --drive-root-folder-id "$GOOGLE_DRIVE_ROOT_FOLDER_ID" \
            --drive-layout "${{ inputs.drive_layout }}" \
            --workers 5 \
            --output-dir google_drive_storage

      - name: Upload migration audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-google-drive-migration-${{ inputs.mode }}
          path: google_drive_storage/
          if-no-files-found: error
          retention-days: 30
