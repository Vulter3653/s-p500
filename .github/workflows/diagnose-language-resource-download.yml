name: Diagnose language resource downloads

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-language-resource-download.yml"
      - ".github/language-resource-diagnostic-trigger"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compute official LM fallback fingerprints
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import sys
          import tempfile
          from pathlib import Path
          from urllib.request import Request, urlopen

          sys.path.insert(0, str(Path.cwd() / "scripts"))
          import load_loughran_mcdonald_dictionary as lm

          url = "https://docs.google.com/spreadsheets/d/1P3KtWuDyQT2Eu_VwTU3D2sEeQxR9dWCS/export?format=csv"
          request = Request(url, headers={"User-Agent": "s-p500-research-workflow"})
          with urlopen(request, timeout=180) as response:
              payload = response.read()
              print(f"status={getattr(response, 'status', '')}")
              print(f"final_url={response.geturl()}")
              print(f"content_type={response.headers.get('Content-Type', '')}")
              print(f"content_disposition={response.headers.get('Content-Disposition', '')}")

          raw_sha = hashlib.sha256(payload).hexdigest()
          print(f"raw_bytes={len(payload)}")
          print(f"raw_sha256={raw_sha}")

          with tempfile.TemporaryDirectory() as temporary:
              source = Path(temporary) / "lm_fallback.csv"
              source.write_bytes(payload)
              mappings, metadata = lm.load_dictionary(
                  path=source,
                  expected_sha256=raw_sha,
                  write_analysis_file=True,
              )
              analysis = lm.ANALYSIS_PATH
              analysis_payload = analysis.read_bytes()
              print(f"analysis_bytes={len(analysis_payload)}")
              print(f"analysis_sha256={hashlib.sha256(analysis_payload).hexdigest()}")
              print(f"row_count={metadata['row_count']}")
              print(f"column_count={metadata['column_count']}")
              print(f"mapping_count={len(mappings)}")
              print(f"first_word={next(iter(mappings))}")
              print(f"last_word={next(reversed(mappings))}")
              print(f"category_counts={metadata['category_word_counts']}")
              print(f"negative_source_counts={metadata['negative_source_value_counts']}")
          PY
