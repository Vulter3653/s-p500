name: Replace OLS section once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-ols-section-once.yml'

permissions:
  contents: write

jobs:
  replace-ols:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace section 06 with supplied OLS outputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, re

          payload = ''''''
          section = gzip.decompress(base64.b64decode(payload)).decode('utf-8')
          path = Path('web/public/current_report.html')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(r'<section id="ols">.*?</section>', re.S)
          new_text, n = pattern.subn(section, text, count=1)
          if n != 1:
              raise SystemExit(f'Expected exactly one OLS section, replaced={n}')
          path.write_text(new_text, encoding='utf-8')
          print('OLS_SECTION_REPLACED', len(section), len(new_text))
          PY

      - name: Commit report and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/replace-ols-section-once.yml
          git add web/public/current_report.html
          git commit -m "Replace OLS section with supplied regression tables"
          git push
