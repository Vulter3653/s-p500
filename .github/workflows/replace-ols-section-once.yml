name: Replace OLS section once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-ols-section-once.yml'

permissions:
  contents: write

jobs:
  replace-ols:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace section 06 with supplied OLS outputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, re

          payloads = [
              ('''''', 'feeb13a253b265211039fa687ca14698feb6d1f7262f0ee9f6904d4a6a48ed9e'),
              ('''''', '4330aa3d6fde2827104599c1a15112c4fd5cfb0a2fb7a3fe3619b343fbcea5a3'),
              ('''''', '1c20c6931bb1257c02526d58fdd426b8d2c710bbfff69850905508ff5dfe70d6')
          ]

          fragments = []
          for payload, expected_sha in payloads:
              fragment = gzip.decompress(base64.b64decode(payload)).decode('utf-8')
              actual_sha = hashlib.sha256(fragment.encode('utf-8')).hexdigest()
              if actual_sha != expected_sha:
                  raise SystemExit(f'Fragment SHA mismatch: {actual_sha} != {expected_sha}')
              fragments.append(fragment)

          section = '<section id="ols"><div class="num">06 · OLS TABLE</div><h2>OLS Table</h2>\n' + '\n'.join(fragments) + '\n</section>'
          path = Path('web/public/current_report.html')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(r'<section id="ols">.*?</section>', re.S)
          new_text, n = pattern.subn(section, text, count=1)
          if n != 1:
              raise SystemExit(f'Expected exactly one OLS section, replaced={n}')
          path.write_text(new_text, encoding='utf-8')
          print('OLS_SECTION_REPLACED', len(section), len(new_text))
          PY

      - name: Commit report and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/replace-ols-section-once.yml
          git add web/public/current_report.html
          git commit -m "Replace OLS section with supplied regression tables"
          git push
