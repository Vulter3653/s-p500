name: Apply official LM dictionary fallback

on:
  pull_request:
    paths:
      - ".github/workflows/apply-lm-dictionary-fallback.yml"
      - ".github/lm-dictionary-fallback-trigger"

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lm-dictionary-official-fallback
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply production patch
        run: |
          python - <<'PY'
          from pathlib import Path

          core_path = Path("scripts/run_yearly_10k_batch_core.py")
          source = core_path.read_text(encoding="utf-8")

          constants_marker = '''SMART_ANALYSIS = (
              ROOT
              / "references/dictionaries/brysbaert_concreteness/"
              "analysis_ready_dictionary/smart_stopwords_tidytext_0.3.1.txt"
          )
          '''
          constants = '''
          LM_FALLBACK_URL = (
              "https://docs.google.com/spreadsheets/d/"
              "1P3KtWuDyQT2Eu_VwTU3D2sEeQxR9dWCS/export?format=csv"
          )
          LM_FALLBACK_SHA256 = (
              "147cb24a1687ccde60363a0fa29c62be4097debcc698c01a83e51bb8a176dbb3"
          )
          LM_FALLBACK_ANALYSIS_SHA256 = (
              "b1f67155d27b32086553cc79049df89e940c42ce9106e8640a0d631160187ad7"
          )
          LM_FALLBACK_EXPECTED_ROW_COUNT = 86553
          LM_FALLBACK_EXPECTED_CATEGORY_COUNTS = {
              "positive": 347,
              "negative": 2345,
              "uncertainty": 297,
              "litigious": 903,
              "strong_modal": 19,
              "weak_modal": 27,
              "constraining": 184,
          }
          LM_FALLBACK_EXPECTED_NEGATIVE_SOURCE_COUNTS = {
              "positive": 7,
              "negative": 10,
              "uncertainty": 0,
              "litigious": 2,
              "strong_modal": 0,
              "weak_modal": 0,
              "constraining": 0,
          }
          '''
          if source.count(constants_marker) != 1:
              raise SystemExit("SMART analysis marker is missing or non-unique")
          source = source.replace(constants_marker, constants_marker + constants, 1)

          old_ensure = '''def ensure_language_resources() -> None:
              if LM_ANALYSIS.is_file() and BRYSBAERT_ANALYSIS.is_file() and SMART_ANALYSIS.is_file():
                  return
              if not LM_SOURCE.is_file():
                  download_file(LM_URL, LM_SOURCE, LM_SHA256)
              load_lm(write_analysis_file=True)
              if not BRYSBAERT_SOURCE.is_file():
          '''
          new_ensure = '''def ensure_lm_resource() -> None:
              """Build the validated LM analysis file with an official fallback."""
              if LM_ANALYSIS.is_file():
                  return

              source_sha = sha256_file(LM_SOURCE) if LM_SOURCE.is_file() else ""
              if source_sha not in {LM_SHA256, LM_FALLBACK_SHA256}:
                  LM_SOURCE.unlink(missing_ok=True)
                  try:
                      download_file(LM_URL, LM_SOURCE, LM_SHA256)
                      source_sha = LM_SHA256
                  except Exception as primary_error:
                      try:
                          download_file(
                              LM_FALLBACK_URL,
                              LM_SOURCE,
                              LM_FALLBACK_SHA256,
                          )
                          source_sha = LM_FALLBACK_SHA256
                      except Exception as fallback_error:
                          raise RuntimeError(
                              "LM dictionary download failed for both the primary "
                              "file and official Google Sheets export; primary "
                              f"error={type(primary_error).__name__}: {primary_error}"
                          ) from fallback_error

              if source_sha == LM_SHA256:
                  load_lm(write_analysis_file=True)
                  return

              mappings, metadata = load_lm(
                  expected_sha256=LM_FALLBACK_SHA256,
                  write_analysis_file=True,
              )
              if metadata.get("row_count") != LM_FALLBACK_EXPECTED_ROW_COUNT:
                  LM_ANALYSIS.unlink(missing_ok=True)
                  raise ValueError(
                      "LM fallback row count mismatch: "
                      f"expected {LM_FALLBACK_EXPECTED_ROW_COUNT}, "
                      f"got {metadata.get('row_count')}"
                  )
              if len(mappings) != LM_FALLBACK_EXPECTED_ROW_COUNT:
                  LM_ANALYSIS.unlink(missing_ok=True)
                  raise ValueError(
                      "LM fallback mapping count mismatch: "
                      f"expected {LM_FALLBACK_EXPECTED_ROW_COUNT}, "
                      f"got {len(mappings)}"
                  )
              if (
                  metadata.get("category_word_counts")
                  != LM_FALLBACK_EXPECTED_CATEGORY_COUNTS
              ):
                  LM_ANALYSIS.unlink(missing_ok=True)
                  raise ValueError("LM fallback category counts mismatch")
              if (
                  metadata.get("negative_source_value_counts")
                  != LM_FALLBACK_EXPECTED_NEGATIVE_SOURCE_COUNTS
              ):
                  LM_ANALYSIS.unlink(missing_ok=True)
                  raise ValueError("LM fallback source-value counts mismatch")
              analysis_sha = sha256_file(LM_ANALYSIS)
              if analysis_sha != LM_FALLBACK_ANALYSIS_SHA256:
                  LM_ANALYSIS.unlink(missing_ok=True)
                  raise ValueError(
                      "LM fallback analysis SHA mismatch: "
                      f"expected {LM_FALLBACK_ANALYSIS_SHA256}, got {analysis_sha}"
                  )


          def ensure_language_resources() -> None:
              if LM_ANALYSIS.is_file() and BRYSBAERT_ANALYSIS.is_file() and SMART_ANALYSIS.is_file():
                  return
              ensure_lm_resource()
              if not BRYSBAERT_SOURCE.is_file():
          '''
          if source.count(old_ensure) != 1:
              raise SystemExit("language resource function marker is missing or non-unique")
          source = source.replace(old_ensure, new_ensure, 1)
          core_path.write_text(source, encoding="utf-8")

          workflow_path = Path(".github/workflows/test-yearly-runner-generalization.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          workflow = workflow.replace(
              '      - "tests/test_run_yearly_10k_batch_diagnostics.py"\n',
              '      - "tests/test_run_yearly_10k_batch_diagnostics.py"\n'
              '      - "tests/test_lm_dictionary_fallback.py"\n',
              1,
          )
          workflow = workflow.replace(
              '            tests/test_run_yearly_10k_batch_diagnostics.py \\\n',
              '            tests/test_run_yearly_10k_batch_diagnostics.py \\\n'
              '            tests/test_lm_dictionary_fallback.py \\\n',
              1,
          )
          workflow = workflow.replace(
              '            tests/test_run_yearly_10k_batch_diagnostics.py\n',
              '            tests/test_run_yearly_10k_batch_diagnostics.py\n'
              '            tests/test_lm_dictionary_fallback.py\n',
              1,
          )
          workflow_path.write_text(workflow, encoding="utf-8")
          PY

          cat > tests/test_lm_dictionary_fallback.py <<'PYTEST'
          from __future__ import annotations

          import hashlib
          import sys
          from pathlib import Path

          import pytest

          sys.path.insert(0, str(Path(__file__).resolve().parents[1] / "scripts"))

          import run_yearly_10k_batch_core as core  # noqa: E402


          def configure_paths(monkeypatch, tmp_path: Path) -> None:
              monkeypatch.setattr(core, "LM_SOURCE", tmp_path / "lm.csv")
              monkeypatch.setattr(core, "LM_ANALYSIS", tmp_path / "analysis.csv")
              monkeypatch.setattr(core, "LM_URL", "primary")
              monkeypatch.setattr(core, "LM_FALLBACK_URL", "fallback")
              monkeypatch.setattr(
                  core, "LM_SHA256", hashlib.sha256(b"primary").hexdigest()
              )
              monkeypatch.setattr(
                  core,
                  "LM_FALLBACK_SHA256",
                  hashlib.sha256(b"fallback").hexdigest(),
              )
              monkeypatch.setattr(
                  core,
                  "LM_FALLBACK_ANALYSIS_SHA256",
                  hashlib.sha256(b"analysis").hexdigest(),
              )
              monkeypatch.setattr(core, "LM_FALLBACK_EXPECTED_ROW_COUNT", 2)
              monkeypatch.setattr(
                  core,
                  "LM_FALLBACK_EXPECTED_CATEGORY_COUNTS",
                  {"positive": 1},
              )
              monkeypatch.setattr(
                  core,
                  "LM_FALLBACK_EXPECTED_NEGATIVE_SOURCE_COUNTS",
                  {"positive": 0},
              )


          def valid_fallback_loader(*, expected_sha256: str, write_analysis_file: bool):
              assert expected_sha256 == core.LM_FALLBACK_SHA256
              assert write_analysis_file is True
              core.LM_ANALYSIS.parent.mkdir(parents=True, exist_ok=True)
              core.LM_ANALYSIS.write_bytes(b"analysis")
              return (
                  {"alpha": {}, "beta": {}},
                  {
                      "row_count": 2,
                      "category_word_counts": {"positive": 1},
                      "negative_source_value_counts": {"positive": 0},
                  },
              )


          def test_primary_sha_failure_uses_validated_official_fallback(
              monkeypatch, tmp_path: Path
          ):
              configure_paths(monkeypatch, tmp_path)
              calls = []

              def fake_download(url: str, destination: Path, expected_sha: str):
                  calls.append((url, expected_sha))
                  if url == "primary":
                      raise ValueError("download SHA mismatch for lm.csv")
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(b"fallback")

              monkeypatch.setattr(core, "download_file", fake_download)
              monkeypatch.setattr(core, "load_lm", valid_fallback_loader)

              core.ensure_lm_resource()

              assert calls == [
                  ("primary", core.LM_SHA256),
                  ("fallback", core.LM_FALLBACK_SHA256),
              ]
              assert core.LM_ANALYSIS.read_bytes() == b"analysis"


          def test_fallback_semantic_mismatch_is_rejected(monkeypatch, tmp_path: Path):
              configure_paths(monkeypatch, tmp_path)

              def fake_download(url: str, destination: Path, expected_sha: str):
                  if url == "primary":
                      raise ValueError("quota response")
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(b"fallback")

              def bad_loader(*, expected_sha256: str, write_analysis_file: bool):
                  core.LM_ANALYSIS.write_bytes(b"analysis")
                  return (
                      {"alpha": {}},
                      {
                          "row_count": 1,
                          "category_word_counts": {"positive": 1},
                          "negative_source_value_counts": {"positive": 0},
                      },
                  )

              monkeypatch.setattr(core, "download_file", fake_download)
              monkeypatch.setattr(core, "load_lm", bad_loader)

              with pytest.raises(ValueError, match="row count mismatch"):
                  core.ensure_lm_resource()
              assert not core.LM_ANALYSIS.exists()


          def test_both_download_paths_failing_preserves_failure(monkeypatch, tmp_path: Path):
              configure_paths(monkeypatch, tmp_path)

              def failed_download(url: str, destination: Path, expected_sha: str):
                  raise ValueError(f"invalid response from {url}")

              monkeypatch.setattr(core, "download_file", failed_download)

              with pytest.raises(RuntimeError, match="both the primary"):
                  core.ensure_lm_resource()
              assert not core.LM_SOURCE.exists()
              assert not core.LM_ANALYSIS.exists()
          PYTEST

      - name: Validate production patch
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
          python -m py_compile scripts/run_yearly_10k_batch_core.py
          pytest -q \
            tests/test_yearly_batch_generalization.py \
            tests/test_run_yearly_10k_batch_diagnostics.py \
            tests/test_plain_text_10k_parser.py \
            tests/test_lm_dictionary_fallback.py \
            tests/test_continuous_backfill.py

      - name: Commit validated patch
        run: |
          rm .github/workflows/apply-lm-dictionary-fallback.yml
          rm .github/lm-dictionary-fallback-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add official fallback for LM dictionary downloads"
          git push origin HEAD:fix/lm-dictionary-official-fallback
