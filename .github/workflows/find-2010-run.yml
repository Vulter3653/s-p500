name: Find 2010 continuation run

on:
  pull_request:
    paths:
      - ".github/workflows/find-2010-run.yml"
      - ".github/find-2010-run-trigger"

permissions:
  contents: read
  actions: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query runs for trigger SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          sha = "d809e98a0389eee1088e9560ef8ba007689b5a54"
          url = (
              "https://api.github.com/repos/Vulter3653/s-p500/actions/runs"
              f"?head_sha={sha}&per_page=20"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "s-p500-run-diagnostic",
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              payload = json.load(response)
          selected = [
              {
                  key: run.get(key)
                  for key in (
                      "id", "name", "event", "status", "conclusion",
                      "head_sha", "created_at", "updated_at", "html_url",
                  )
              }
              for run in payload.get("workflow_runs", [])
          ]
          print(json.dumps(selected, indent=2, sort_keys=True))
          PY
