name: Migrate historical R2 inventory to Google Drive

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Comma-separated historical years to migrate from the live R2 inventory"
        required: true
        type: string
        default: "2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019"
      drive_layout:
        description: "Must match existing 2020–2025 Drive layout"
        required: true
        type: choice
        options:
          - legacy_nested
        default: legacy_nested

permissions:
  contents: read

concurrency:
  group: historical-r2-drive-inventory-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Historical R2 inventory migration
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Confirm required secrets
        shell: bash
        run: |
          missing=0
          for name in             GOOGLE_DRIVE_CLIENT_ID GOOGLE_DRIVE_CLIENT_SECRET             GOOGLE_DRIVE_REFRESH_TOKEN GOOGLE_DRIVE_ROOT_FOLDER_ID             R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT_URL R2_BUCKET_NAME
          do
            if [[ -n "${!name:-}" ]]; then echo "$name=set"; else echo "$name=missing"; missing=1; fi
          done
          exit "$missing"

      - name: Build live R2 inventory manifest
        run: |
          python scripts/build_r2_html_inventory_manifest.py             --years "${{ inputs.years }}"             --output google_drive_storage/r2_inventory_manifest.csv

      - name: Migrate inventory using existing Drive layout
        run: |
          python scripts/migrate_r2_html_to_google_drive.py             --manifest google_drive_storage/r2_inventory_manifest.csv             --drive-root-folder-id "$GOOGLE_DRIVE_ROOT_FOLDER_ID"             --drive-layout "${{ inputs.drive_layout }}"             --workers 5             --output-dir google_drive_storage

      - name: Upload migration audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-r2-google-drive-migration
          path: google_drive_storage/
          if-no-files-found: error
          retention-days: 30
