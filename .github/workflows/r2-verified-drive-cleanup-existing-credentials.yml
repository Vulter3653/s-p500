name: R2 Verified Drive Cleanup Existing Credentials

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2-verified-drive-cleanup-existing-credentials
  cancel-in-progress: false

jobs:
  dry-run:
    name: Verify Drive and build fail-closed R2 dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate secret presence without exposing values
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in \
            R2_ACCESS_KEY_ID \
            R2_SECRET_ACCESS_KEY \
            R2_ENDPOINT_URL \
            R2_BUCKET_NAME \
            GOOGLE_DRIVE_CLIENT_ID \
            GOOGLE_DRIVE_CLIENT_SECRET \
            GOOGLE_DRIVE_REFRESH_TOKEN
          do
            if [[ -n "${!name:-}" ]]; then
              echo "$name=set"
            else
              echo "$name=missing"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Install minimal dry-run dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            boto3 \
            google-auth \
            requests \
            pytest

      - name: Enforce no-deletion source policy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("scripts/storage/build_r2_verified_drive_cleanup.py"),
              Path("scripts/storage/run_verified_r2_cleanup_existing_credentials.py"),
          ]
          forbidden = (
              "delete_object(" + "",
              "delete_objects(" + "",
              "--execute-delete",
              "execute_shard",
          )
          for path in paths:
              source = path.read_text(encoding="utf-8")
              for token in forbidden:
                  if token in source:
                      raise SystemExit(f"forbidden mutation token {token!r} found in {path}")
          print("NO_DELETION_SOURCE_POLICY=PASS")
          PY

      - name: Compile cleanup code
        run: |
          python -m py_compile \
            scripts/storage/build_r2_verified_drive_cleanup.py \
            scripts/storage/run_verified_r2_cleanup_existing_credentials.py

      - name: Run cleanup unit tests
        run: |
          python -m pytest -q tests/test_r2_verified_drive_cleanup.py

      - name: Run verified dry-run
        run: |
          python scripts/storage/run_verified_r2_cleanup_existing_credentials.py

      - name: Upload aggregate diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-existing-credentials-dry-run-summary
          path: |
            storage_admin/verified_r2_cleanup/dry_run/preflight_summary.json
            storage_admin/verified_r2_cleanup/dry_run/r2_cleanup_summary.json
          if-no-files-found: warn
          retention-days: 30
