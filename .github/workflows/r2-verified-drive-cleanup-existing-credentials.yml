name: R2 Verified Drive Cleanup Existing Credentials

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2-verified-drive-cleanup-existing-credentials
  cancel-in-progress: false

jobs:
  dry-run:
    name: Verify Drive and build R2 cleanup dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate existing credentials
        shell: bash
        run: |
          missing=0

          for name in \
            R2_ACCESS_KEY_ID \
            R2_SECRET_ACCESS_KEY \
            R2_ENDPOINT_URL \
            R2_BUCKET_NAME \
            GOOGLE_DRIVE_CLIENT_ID \
            GOOGLE_DRIVE_CLIENT_SECRET \
            GOOGLE_DRIVE_REFRESH_TOKEN
          do

            if [[ -n "${!name:-}" ]]; then
              echo "$name=set"
            else
              echo "$name=missing"
              missing=1
            fi

          done

          test "$missing" -eq 0

      - name: Validate R2 endpoint format
        shell: bash
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          endpoint = os.environ["R2_ENDPOINT_URL"].strip()
          parsed = urlparse(endpoint)

          assert parsed.scheme == "https"
          assert parsed.hostname
          assert parsed.hostname.endswith(".r2.cloudflarestorage.com")

          print("R2_ENDPOINT_URL_FORMAT=valid")
          PY

      - name: Install dependencies
        run: |
          python -m pip install \
            boto3 \
            pandas \
            pyarrow \
            google-auth \
            google-api-python-client

      - name: Compile cleanup scripts
        run: |
          python -m py_compile \
            scripts/storage/build_r2_verified_drive_cleanup.py \
            scripts/storage/run_verified_r2_cleanup_existing_credentials.py

      - name: Run verified dry-run
        run: |
          python \
            scripts/storage/run_verified_r2_cleanup_existing_credentials.py

      - name: Upload aggregate summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-existing-credentials-dry-run-summary
          path: |
            storage_admin/verified_r2_cleanup/dry_run/r2_cleanup_summary.json
          if-no-files-found: warn
          retention-days: 30
