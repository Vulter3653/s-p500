name: Find 2008 continuation run

on:
  pull_request:
    paths:
      - '.github/workflows/find-2008-run.yml'
      - '.github/find-2008-run-trigger'

permissions:
  actions: read
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: Query runs for 2009 publication merge SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          sha = "0083465f8fac6dfa850bccce9a2546015f8bcffa"
          url = (
              "https://api.github.com/repos/Vulter3653/s-p500/actions/runs"
              f"?head_sha={sha}&per_page=30"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "s-p500-run-diagnostic",
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              payload = json.load(response)
          selected = [
              {
                  key: run.get(key)
                  for key in (
                      "id", "name", "event", "status", "conclusion",
                      "head_sha", "head_branch", "created_at", "updated_at", "html_url",
                  )
              }
              for run in payload.get("workflow_runs", [])
          ]
          print(json.dumps(selected, indent=2, sort_keys=True))
          PY
