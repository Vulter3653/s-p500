   <tr><td>StopAI</td><td>-0.045</td><td>1.000</td><td>-0.020</td><td>-0.008</td><td>-0.003</td><td>-0.024</td><td>-0.023</td><td>0.010</td><td>-0.007</td><td>-0.014</td></tr>
   <tr><td>FOG</td><td>0.015</td><td>-0.020</td><td>1.000</td><td>0.252</td><td>0.364</td><td>0.026</td><td>0.177</td><td>0.086</td><td>0.203</td><td>-0.043</td></tr>
   <tr><td>ln(FileSize)</td><td>0.032</td><td>-0.008</td><td>0.252</td><td>1.000</td><td><strong>0.711</strong></td><td>-0.052</td><td>0.102</td><td>0.150</td><td>0.322</td><td>-0.161</td></tr>
   <tr><td>ln(TotalWords)</td><td>0.020</td><td>-0.003</td><td>0.364</td><td><strong>0.711</strong></td><td>1.000</td><td>-0.078</td><td>0.207</td><td>0.059</td><td>0.310</td><td>-0.069</td></tr>
   <tr><td>PositiveTone</td><td>0.020</td><td>-0.024</td><td>0.026</td><td>-0.052</td><td>-0.078</td><td>1.000</td><td>0.167</td><td>-0.056</td><td>-0.085</td><td>0.160</td></tr>
   <tr><td>NegativeTone</td><td>-0.003</td><td>-0.023</td><td>0.177</td><td>0.102</td><td>0.207</td><td>0.167</td><td>1.000</td><td>-0.085</td><td>0.132</td><td>0.189</td></tr>
   <tr><td>LEV</td><td>0.043</td><td>0.010</td><td>0.086</td><td>0.150</td><td>0.059</td><td>-0.056</td><td>-0.085</td><td>1.000</td><td>-0.003</td><td>-0.212</td></tr>
   <tr><td>SIZE</td><td>0.018</td><td>-0.007</td><td>0.203</td><td>0.322</td><td>0.310</td><td>-0.085</td><td>0.132</td><td>-0.003</td><td>1.000</td><td>-0.212</td></tr>
   <tr><td>CASH</td><td>-0.024</td><td>-0.014</td><td>-0.043</td><td>-0.161</td><td>-0.069</td><td>0.160</td><td>0.189</td><td>-0.212</td><td>-0.212</td><td>1.000</td></tr>
   </tbody></table></div><p class="table-note">N=8,966 complete cases. 가장 큰 상관은 ln(FileSize)–ln(TotalWords)=0.7109이다. FOG–ln(FileSize)=0.2521, FOG–ln(TotalWords)=0.3635이다.</p></div>
   <div class="table-card"><h3>Table 3. Model 1J VIF range across six CAR windows</h3><div class="table-scroll"><table class="paper-table"><thead><tr><th>Variable</th><th>VIF min</th><th>VIF max</th><th>N range</th><th>진단</th></tr></thead><tbody>

   </tbody></table></div><p class="table-note">Model 1J의 substantive regressors 최대 VIF는 2.297이다. 현재 Start/Stop + textual controls + LEV/SIZE/CASH 구조에서는 심각한 다중공선성 신호가 나타나지 않는다.</p></div>
   <div class="table-card"><h3>Table 4. Model 1L interaction-specific VIF summary</h3><div class="table-scroll"><table class="paper-table"><thead><tr><th>Moderator</th><th>Direction</th><th>Event VIF range</th><th>Moderator VIF range</th><th>Interaction VIF range</th><th>진단</th></tr></thead><tbody>

   </tbody></table></div><p class="table-note">Model 1L 기존 산출물 <code>18D_model1l_substantive_regressor_vif.csv</code>를 집계했다. controls의 전체 최대 VIF는 2.581이다. Concreteness interaction에서만 Event와 Event×Concreteness 사이의 VIF가 매우 높다. 현재 규칙에 따라 mean-centering이나 자동 변수 제거는 적용하지 않았다.</p></div>
   <p class="caution"><strong>현재 판단.</strong> FOG와 ln(FileSize)를 동시에 포함하는 것 자체는 Model 1J에서 다중공선성 문제를 만들지 않는다. 반면 Model 1L의 <strong>Concreteness × disclosure-change</strong>는 매우 높은 VIF를 동반하므로 해당 interaction 결과는 이 진단과 함께 해석해야 한다. 이 Step 4에서는 진단만 추가했고 기존 specification은 변경하지 않았다.</p>

  const descriptive=doc.querySelector('#descriptive');if(descriptive&&descriptive.nextSibling)descriptive.parentNode.insertBefore(section,descriptive.nextSibling);else descriptive?.parentNode.appendChild(section);
