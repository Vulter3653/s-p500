   @media(max-width:820px){#single-ols .mail-explain{grid-template-columns:1fr}}
  `;doc.head.appendChild(style);

  const nav=doc.querySelector('.toc nav');if(nav&&!nav.querySelector('a[href="#single-ols"]')){const a=doc.createElement('a');a.href='#single-ols';a.textContent='08 · 대표 OLS 결과표';const m=nav.querySelector('a[href="#method"]');if(m)nav.insertBefore(a,m);else nav.appendChild(a);}

  const section=doc.createElement('section');section.id='single-ols';section.className='report-section';section.innerHTML=`
   <div class="section-heading"><span class="section-number">08</span><div><p class="kicker">Representative OLS Output</p><h2>교수님 메일의 첫 번째 결과를 설명하는 단일 OLS 결과표</h2></div></div>
   <div class="ols-banner"><strong>Step 6 반영.</strong> 요청한 예시의 <code>statsmodels summary()</code> 형식을 참고하여 <strong>회귀결과표는 정확히 하나만</strong> 추가한다. 대표표는 전체 10-K의 Model 1J Start/Stop decomposition에서 <code>CAR[-2,0]</code>을 종속변수로 한 사양이다. 이 window는 전체 StartAI 결과 중 nominal p-value가 가장 작아 <strong>메일 1번을 설명하기 위한 display example</strong>로 선택했으며, 연구의 primary event window로 지정한 것이 아니다.</div>

   <div class="ols-wrap"><table class="statsmodels-summary" aria-label="Model 1J overall Start Stop OLS results for CAR minus2 to 0">
    <thead>
     <tr class="title-row"><th colspan="7">OLS Regression Results — Model 1J Overall Start / Stop, CAR[-2,0]</th></tr>
    </thead>
    <tbody>
     <tr class="meta"><td class="label">Dep. Variable:</td><td colspan="2">V8_CAR_MM_m2_0</td><td class="label">R-squared:</td><td colspan="3">0.132</td></tr>
     <tr class="meta"><td class="label">Model:</td><td colspan="2">OLS</td><td class="label">Adj. R-squared:</td><td colspan="3">0.036</td></tr>
     <tr class="meta"><td class="label">Method:</td><td colspan="2">Least Squares</td><td class="label">F-statistic:</td><td colspan="3">1.376</td></tr>
     <tr class="meta"><td class="label">No. Observations:</td><td colspan="2">8,886</td><td class="label">Prob (F-statistic):</td><td colspan="3">1.36e-11</td></tr>
     <tr class="meta"><td class="label">Df Residuals:</td><td colspan="2">8,002</td><td class="label">Log-Likelihood:</td><td colspan="3">17,122</td></tr>
     <tr class="meta"><td class="label">Df Model:</td><td colspan="2">883</td><td class="label">AIC / BIC:</td><td colspan="3">-3.248e+04 / -2.621e+04</td></tr>
     <tr class="meta"><td class="label">Covariance Type:</td><td colspan="2">nonrobust</td><td class="label">Reference:</td><td colspan="3">NoChange (0→0 or 1→1)</td></tr>
     <tr class="coef-head"><th>Variable</th><th>coef</th><th>std err</th><th>t</th><th>P&gt;|t|</th><th>[0.025</th><th>0.975]</th></tr>
     <tr><td>const</td><td>0.0466</td><td>0.031</td><td>1.487</td><td>0.137</td><td>-0.015</td><td>0.108</td></tr>
     <tr class="focal"><td>AI_Mention_Start_0to1</td><td>-0.0045</td><td>0.002</td><td>-2.558</td><td>0.011</td><td>-0.008</td><td>-0.001</td></tr>
     <tr class="focal"><td>AI_Mention_Stop_1to0</td><td>-0.0006</td><td>0.002</td><td>-0.257</td><td>0.797</td><td>-0.005</td><td>0.004</td></tr>
     <tr><td>FOG</td><td>-0.000025</td><td>0.001</td><td>-0.029</td><td>0.977</td><td>-0.002</td><td>0.002</td></tr>
     <tr><td>ln(FileSize)</td><td>-0.0008</td><td>0.001</td><td>-0.619</td><td>0.536</td><td>-0.004</td><td>0.002</td></tr>
     <tr><td>ln(TotalWords)</td><td>-0.000072</td><td>0.002</td><td>-0.031</td><td>0.975</td><td>-0.005</td><td>0.004</td></tr>
     <tr><td>PositiveTone</td><td>-0.0017</td><td>0.006</td><td>-0.276</td><td>0.782</td><td>-0.013</td><td>0.010</td></tr>
     <tr><td>NegativeTone</td><td>0.0002</td><td>0.002</td><td>0.075</td><td>0.941</td><td>-0.004</td><td>0.004</td></tr>
     <tr><td>LEV</td><td>-0.0026</td><td>0.005</td><td>-0.575</td><td>0.565</td><td>-0.012</td><td>0.006</td></tr>
     <tr><td>SIZE = ln(TotalAssets)</td><td>-0.0038</td><td>0.001</td><td>-2.764</td><td>0.006</td><td>-0.006</td><td>-0.001</td></tr>
     <tr><td>CASH</td><td>-0.0034</td><td>0.007</td><td>-0.482</td><td>0.630</td><td>-0.017</td><td>0.011</td></tr>
     <tr class="diag"><td>Omnibus</td><td>1818.279</td><td>Prob(Omnibus)</td><td>0.000</td><td>Durbin-Watson</td><td colspan="2">2.238</td></tr>
     <tr><td>Jarque-Bera (JB)</td><td>64674.964</td><td>Prob(JB)</td><td>0.000</td><td>Skew / Kurtosis</td><td colspan="2">-0.107 / 16.215</td></tr>
     <tr><td>Cond. No.</td><td>3.48e+04</td><td>Firm FE</td><td>Included</td><td>Year FE</td><td colspan="2">Included</td></tr>
    </tbody>
   </table></div>

   <p><strong>메일 1번의 의미.</strong> 이 표에서 핵심은 <code>AI_Mention_Start_0to1</code>이다. 정확한 저장계수는 β=-0.0045333, p=0.01054로, NoChange 집단과 비교하면 전년도에는 AI를 언급하지 않았으나 당해연도 새롭게 언급하기 시작한 기업의 CAR[-2,0]가 약 <strong>-0.453%p</strong> 낮게 나타난다. 반면 전체 10-K의 <code>StopAI</code>는 β=-0.000616, p=0.797로 뚜렷하지 않다. 따라서 메일의 “전체 10-K에서는 새롭게 AI를 언급하기 시작한 기업에서 음의 시장반응”이라는 문장은 이 Model 1J 결과를 요약한 것이다.</p>
   <p class="caution"><strong>한 window만 보고 결론을 선택한 것은 아니다.</strong> 전체 StartAI는 [-1,+1], [-2,+2], [-1,+2], [-2,0] 네 window에서 nominal p&lt;.05이고 6개 window 모두 계수 방향은 음(-)이다. 현재 여섯 window는 계속 exploratory이며 primary window는 지정하지 않았다.</p>

   <div class="mail-explain">
    <div><strong>메일 1 · 전체 10-K 신규 AI 언급</strong><p>위 단일 표가 직접 설명한다. StartAI(0→1)가 NoChange에 비해 음(-)의 CAR를 보이며, StopAI는 전체 수준에서는 뚜렷하지 않다.</p></div>
    <div><strong>메일 2 · Section별 차이</strong><p>이 단일 표의 대상은 전체 10-K이므로 Item 1A와 Item 7 결과는 별도의 section specification에서 나온다. Item 1A는 신규/최초 관측 AI 공시에서 음(-)의 방향, Item 7은 StopAI에서 일부 window의 음(-) 결과가 나타났다.</p></div>
    <div><strong>메일 3 · Concreteness / Tense</strong><p>이 표가 아니라 Model 1L의 interaction 결과다. Item 1 Business에서 StopAI×prior Concreteness가 여러 window에서 음(-) 방향이고, PastFocus interaction도 일부 window에서 음(-) 결과가 나타났다. 해당 결과는 interaction-specific VIF와 다중검정 한계를 함께 해석한다.</p></div>
   </div>

   <p class="table-note">Firm FE와 Year FE는 실제 OLS design matrix에 포함되어 있으나 수백 개 dummy coefficient를 나열하면 교수님 보고용 표의 가독성이 훼손되므로 <strong>표시에서만 생략</strong>했다. Df Model=883과 R² 등 model statistics는 FE가 포함된 실제 추정모형의 값이다. 원본 authority: <code>16K_model1j_statsmodels_native_summaries.txt</code>, Model 1J overall <code>V8_CAR_MM_m2_0</code>.</p>

  const eventSection=doc.querySelector('#event-window-figures');if(eventSection&&eventSection.nextSibling)eventSection.parentNode.insertBefore(section,eventSection.nextSibling);else eventSection?.parentNode.appendChild(section);

 }catch(e){document.getElementById('loader').innerHTML='<h1>보고서를 표시할 수 없습니다.</h1><pre>'+String(e)+'</pre>';}
