   <div class="section-heading"><span class="section-number">09</span><div><p class="kicker">Professor Meeting Brief</p><h2>교수님께 보고한 세 가지 결과의 상세 근거</h2></div></div>
   <p>이 절은 새로운 가설이나 결과를 추가하는 절이 아니다. 2026년 9월 오프라인 미팅에 앞서 전달한 메일의 세 문장이 <strong>어떤 변수, 표본, 회귀모형과 결과에서 도출되었는지</strong>를 추적할 수 있도록 기존 분석 결과를 연결한다.</p>
   <div class="mail-original"><strong>보고 내용 1.</strong> “전체 10-K 리포트에서는 이전 연도에 AI를 언급하지 않았다가 새롭게 언급하기 시작한 기업에서 음의 시장반응이 나타났습니다.”</div>
   <div class="result-card"><h3>1. 전체 10-K — AI 언급 시작(StartAI)과 시장반응</h3>
    <p><strong>분석 정의.</strong> 같은 기업에서 연속된 연도의 AI_Mention을 비교하여 전년도 0, 당해연도 1이면 StartAI=1로 정의했다. StopAI는 1→0이며, 비교집단 NoChange는 0→0과 1→1이다. 결측된 전년도를 0으로 대체하지 않았다.</p>
    <p><strong>모형.</strong> Model 1J에서 StartAI와 StopAI를 동시에 포함하고, FOG, ln(FileSize), ln(TotalWords), PositiveTone, NegativeTone, 전년도 LEV, SIZE=ln(TotalAssets), CASH와 Firm FE, Year FE를 통제하였다.</p>
    <div class="evidence">StartAI: CAR[-1,+1] β=-0.004578, p=.0127; CAR[-2,+2] β=-0.004866, p=.0276; CAR[-1,+2] β=-0.004451, p=.0287; CAR[-2,0] β=-0.004533, p=.0105. 모든 6개 window의 방향은 음(-).</div>
    <p><strong>해석.</strong> 대표적으로 CAR[-2,0]에서 StartAI 기업의 CAR는 NoChange보다 약 <strong>0.453 percentage points 낮다</strong>. 따라서 메일 1번은 단일 window의 우연한 부호가 아니라 여러 window에서 반복된 음(-) 방향을 요약한 것이다. 전체 10-K의 StopAI는 6개 window 모두 뚜렷하지 않았다.</p>
   </div>
   <div class="mail-original"><strong>보고 내용 2.</strong> “1A. Risk Factors에서는 AI 공시를 새롭게 시작하는 경우에 음의 반응이 나타났습니다. 이에 반해 7. MD&amp;A에서는 기존 AI 언급을 중단하는 경우, 일부 시장반응에서 음으로 나타났습니다.”</div>
   <div class="result-card"><h3>2. Section별 차이 — Item 1A Start와 Item 7 Stop</h3>
    <p><strong>Item 1A Risk Factors.</strong> section 단위의 StartAI(0→1)는 모든 주요 window에서 음(-) 방향이다. Model 1J에서 CAR[-2,0] β=-0.003090 (p=.0916), CAR[-1,+2] β=-0.003467 (p=.0998)로 약한 nominal evidence가 관측된다. 앞선 Model 1I의 First_AI_Mention 사양에서는 CAR[-2,0] β=-0.003935 (p=.0431), CAR[-1,+2] β=-0.004391 (p=.0497)였다.</p>
    <p><strong>Item 7 MD&amp;A.</strong> Model 1J에서 StopAI(1→0)는 CAR[-1,+1] β=-0.004634 (p=.0481), CAR[-1,+2] β=-0.005125 (p=.0467), CAR[0,+2] β=-0.004086 (p=.0572)로 일부 window에서 음(-) 방향이 관측되었다. 반면 Item 7 StartAI는 뚜렷하지 않았다.</p>
    <p><strong>왜 서로 다른가.</strong> 전체 10-K의 Start 효과와 section별 Start/Stop은 동일한 현상을 중복 표기한 것이 아니다. section 분석은 특정 section에서의 상태전환을 측정하므로, 전체 문서에서 AI가 존재하더라도 해당 section에서는 새롭게 시작하거나 중단할 수 있다.</p>
   </div>
   <div class="mail-original"><strong>보고 내용 3.</strong> “1. Business에서는 AI 언급을 중단하는 경우, 중단 직전 연도의 Concreteness가 높을수록 시장반응이 더 낮아지는 방향이 관측되었습니다. 또한 과거 시제의 경우에도 일부 시장반응에서 더 낮아지는 방향이 확인되었습니다.”</div>
   <div class="result-card"><h3>3. Item 1 Business — StopAI × AI 언어 특성</h3>
    <p><strong>분석 설계.</strong> AI-specific 언어변수는 AI_Mention=0일 때 구조적으로 정의되지 않으므로 0으로 채우지 않았다. Stop 모형은 전년도 AI_Mention=1인 관측치만 사용하고 Stop(1→0)을 Stay1(1→1)과 비교하며, moderator는 중단 직전 연도(t-1)의 값을 사용한다.</p>
    <p><strong>Concreteness.</strong> StopAI×Concreteness_AI(t-1)는 6개 window 모두 음(-)이다. CAR[-2,+2] β=-0.03605 (p=.0353), CAR[-3,+3] β=-0.05524 (p=.0062), CAR[-1,+2] β=-0.03095 (p=.0488), CAR[-2,0] β=-0.03310 (p=.0212)였다.</p>
    <p><strong>Past tense.</strong> StopAI×PastFocus_AI(t-1)는 CAR[-1,+2] β≈-0.00601 (p=.0308), CAR[0,+2] β≈-0.00527 (p=.0169)로 일부 window에서 음(-)의 interaction이 나타났다. FutureFocus_AI interaction은 전반적으로 뚜렷하지 않았다.</p>
    <p><strong>해석 범위.</strong> 이 결과는 “AI 언급을 중단하면 항상 부정적”이라는 의미가 아니다. <strong>중단 직전 AI 문장의 구체성 또는 과거지향성이 높은 경우 Stop과 시장반응의 관계가 더 음(-)으로 이동하는지</strong>를 본 interaction 결과다.</p>
   </div>
   <div class="limit"><strong>현재 단계의 가장 중요한 한계.</strong> 분석은 여러 event window, section, transition, language moderator를 탐색하고 있으므로 명목적 p-value만으로 확정적 결론을 내릴 수 없다. Model 1L의 language interaction은 엄격한 다중검정 보정 후 5% 수준에서 유지되지 않는다. Model 1J 전체 StartAI의 네 nominal p&lt;.05 결과도 BH-FDR 10% 수준에서는 유지되지만 5%에서는 유지되지 않는다. 따라서 현재 보고서는 결과를 <strong>탐색적 패턴</strong>으로 제시하고, primary event window와 최종 confirmatory specification은 아직 지정하지 않는다.</div>
   <p class="table-note"><strong>보고서 정합성.</strong> 위 설명은 메일의 표현 강도를 그대로 따른다. 전체 10-K는 여러 window에서 반복된 StartAI 음(-) 결과, Item 1A와 Item 7은 section별 일부 결과, Item 1의 Concreteness/PastFocus는 interaction의 방향으로 구분한다. 서로 다른 모형의 결과를 하나의 동일 효과로 합산하거나 해석하지 않는다.</p>

 }catch(e){document.getElementById('loader').innerHTML='<h1>보고서를 표시할 수 없습니다.</h1><pre>'+String(e)+'</pre>';}
