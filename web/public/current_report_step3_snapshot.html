<!doctype html>

<style>html,body{margin:0;padding:0}#loader{font-family:system-ui,sans-serif;padding:40px;color:#22313b}iframe{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:0}</style>
</head>
<body>
<div id="loader">보고서를 불러오고 기술통계를 반영하는 중입니다.</div>
<iframe id="baseframe" src="./current_report_step1_snapshot.html"></iframe>
<script>
(async()=>{
  const frame=document.getElementById('baseframe');
  const waitForBase=()=>new Promise((resolve,reject)=>{
    const started=Date.now();
    const timer=setInterval(()=>{
      try{
        const d=frame.contentDocument;
        if(d && d.querySelector('#variables') && d.querySelector('.report-main')){clearInterval(timer);resolve(d);}
        else if(Date.now()-started>20000){clearInterval(timer);reject(new Error('Step 1 report load timeout'));}
      }catch(e){clearInterval(timer);reject(e);}
    },120);
  });
  try{
  const sourceDoc=await waitForBase();
    const doc=new DOMParser().parseFromString('<!doctype html>'+sourceDoc.documentElement.outerHTML,'text/html');
    const style=doc.createElement('style');
    style.id='step3-style';
    style.textContent=`
      #models .model-banner{padding:16px 18px;margin:0 0 22px;border-left:4px solid #c58935;background:#fbf8f0;color:#6b5b3f;font-size:.82rem;line-height:1.65}
      #models .notation-box{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0 26px}
      #models .notation-box>div{padding:12px 14px;border:1px solid #d7dfe3;background:#f5f7f7}
      #models .notation-box strong{display:block;color:#23313b;font-size:.72rem;margin-bottom:5px}
      #models .notation-box span{color:#5d6b72;font-size:.75rem;line-height:1.55}
      #models .model-card{margin:20px 0;padding:18px 20px;border:1px solid #d7dfe3;background:#fff}
      #models .model-card.current{border-left:4px solid #167c80}
      #models .model-card.history{border-left:4px solid #b5bec3}
      #models .model-label{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
      #models .model-label strong{font-family:Georgia,serif;font-size:1.05rem;color:#23313b}
      #models .badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#eef5f4;color:#35696d;font-size:.65rem;font-weight:750}
      #models .badge.history{background:#f1f3f4;color:#687680}
      #models .eq{margin:10px 0;padding:14px 16px;background:#f6f8f8;border-left:3px solid #167c80;color:#28424c;font-family:Georgia,'Times New Roman',serif;font-size:.93rem;line-height:1.75;overflow-x:auto}
      #models .model-note{margin:8px 0 0;color:#627078;font-size:.76rem;line-height:1.65}

    `;
    doc.head.appendChild(style);

    const nav=doc.querySelector('.toc nav');
    if(nav){
      if(!nav.querySelector('a[href="#models"]')){const a=doc.createElement('a');a.href='#models';a.textContent='04 · 모델 기본식';const m=nav.querySelector('a[href="#method"]');if(m)nav.insertBefore(a,m);else nav.appendChild(a);}
      if(!nav.querySelector('a[href="#descriptive"]')){const a=doc.createElement('a');a.href='#descriptive';a.textContent='05 · 기술통계';const m=nav.querySelector('a[href="#method"]');if(m)nav.insertBefore(a,m);else nav.appendChild(a);}
    }

    const models=doc.createElement('section');models.id='models';models.className='report-section';models.innerHTML=`
      <div class="section-heading"><span class="section-number">04</span><div><p class="kicker">Model Specifications</p><h2>각 모델의 기본식</h2></div></div>
      <div class="model-banner"><strong>Step 2 반영.</strong> 아래 식은 최신 <code>OLS.ipynb</code>의 실제 specification progression을 기준으로 정리하였다. Model 1–1F는 분석 개발과정을 투명하게 보존하기 위한 historical specification이며, <strong>현재 conventional-unit 분석의 기준은 Model 1G 이후</strong>다. 현재 estimator는 <code>statsmodels.api.OLS(...).fit()</code>, covariance는 <code>nonrobust</code>이며, 6개 CAR window는 아직 exploratory로 유지한다.</div>
      <div class="notation-box">
        <div><strong>종속변수</strong><span>CAR<sub>it</sub><sup>[a,b]</sup>: Market Model cumulative abnormal return.</span></div>
        <div><strong>고정효과</strong><span>α<sub>i</sub>: Firm FE(GVKEY_FE), δ<sub>t</sub>: Year FE(ReportYear).</span></div>
        <div><strong>Text controls</strong><span>T<sub>it</sub> = FOG, ln(FileSize), ln(TotalWords), PositiveTone, NegativeTone.</span></div>
        <div><strong>Firm controls</strong><span>F<sub>i,t−1</sub> = LEV, ln(TotalAssets), CASH; validated event-aligned t−1.</span></div>
      </div>
      <div class="model-card history"><div class="model-label"><strong>Model 1 · Initial targeted AI Focus × Language</strong><span class="badge history">development stage</span></div><div class="eq">CAR<sub>it</sub> = β₀ + β₁ AI_Focus<sub>it</sub> + β₂ M<sub>it</sub> + β₃(AI_Focus<sub>it</sub> × M<sub>it</sub>) + ε<sub>it</sub></div><p class="model-note">Controls/FE 없음. 초기 continuous focal variables는 0–1 Min-Max scaling을 사용했으며 Model 1G 이후 폐기.</p></div>
      <div class="model-card history"><div class="model-label"><strong>Model 1B · Expanded AI-specific / within-report language</strong><span class="badge history">development stage</span></div><div class="eq">CAR<sub>it</sub> = β₀ + β₁ AI_Focus<sub>it</sub> + β₂ M<sub>it</sub> + β₃(AI_Focus<sub>it</sub> × M<sub>it</sub>) + ε<sub>it</sub></div><p class="model-note">AI_Mention=1 표본. Moderator는 AI-specific / within-report language를 별도 family로 추정.</p></div>
      <div class="model-card history"><div class="model-label"><strong>Model 1C · + Year Fixed Effects</strong><span class="badge history">development stage</span></div><div class="eq">CAR<sub>it</sub> = β₀ + β₁ AI_Focus<sub>it</sub> + β₂ M<sub>it</sub> + β₃(AI_Focus<sub>it</sub> × M<sub>it</sub>) + δ<sub>t</sub> + ε<sub>it</sub></div></div>
      <div class="model-card history"><div class="model-label"><strong>Model 1D · + Textual Controls</strong><span class="badge history">development stage</span></div><div class="eq">CAR<sub>it</sub> = β₀ + β₁ AI_Focus<sub>it</sub> + β₂ M<sub>it</sub> + β₃(AI_Focus<sub>it</sub> × M<sub>it</sub>) + γ′T<sub>it</sub> + δ<sub>t</sub> + ε<sub>it</sub></div></div>
      <div class="model-card history"><div class="model-label"><strong>Model 1E · + Firm FE</strong><span class="badge history">development stage</span></div><div class="eq">CAR<sub>it</sub> = β₀ + β₁ AI_Focus<sub>it</sub> + β₂ M<sub>it</sub> + β₃(AI_Focus<sub>it</sub> × M<sub>it</sub>) + γ′T<sub>it</sub> + α<sub>i</sub> + δ<sub>t</sub> + ε<sub>it</sub></div></div>
      <div class="model-card history"><div class="model-label"><strong>Model 1F · + LEV, SIZE, CASH</strong><span class="badge history">last Min-Max stage</span></div><div class="eq">CAR<sub>it</sub> = β₀ + β₁ AI_Focus<sub>it</sub> + β₂ M<sub>it</sub> + β₃(AI_Focus<sub>it</sub> × M<sub>it</sub>) + γ′T<sub>it</sub> + θ′F<sub>i,t−1</sub> + α<sub>i</sub> + δ<sub>t</sub> + ε<sub>it</sub></div></div>
      <div class="model-card current"><div class="model-label"><strong>Model 1G · AI Mention Main Effect</strong><span class="badge">current units</span></div><div class="eq">CAR<sub>it</sub> = β₀ + β₁ AI_Mention<sub>it</sub> + γ′T<sub>it</sub> + θ′F<sub>i,t−1</sub> + α<sub>i</sub> + δ<sub>t</sub> + ε<sub>it</sub></div></div>
      <div class="model-card current"><div class="model-label"><strong>Model 1H · Section AI Focus Main Effect</strong><span class="badge">Item 1 / 1A / 7 / 8</span></div><div class="eq">CAR<sub>it</sub> = β₀ + β₁ Section_AI_Focus<sub>ist</sub> + γ′T<sub>it</sub> + θ′F<sub>i,t−1</sub> + α<sub>i</sub> + δ<sub>t</sub> + ε<sub>it</sub></div></div>
      <div class="model-card current"><div class="model-label"><strong>Model 1I · AI Mention Change Timing</strong><span class="badge">3 separate families</span></div>
        <div class="eq subeq"><strong>1I-A Overall Δ:</strong> CAR<sub>it</sub> = β₀ + β₁ ΔAI_Mention<sub>it</sub> + γ′T<sub>it</sub> + θ′F<sub>i,t−1</sub> + α<sub>i</sub> + δ<sub>t</sub> + ε<sub>it</sub></div>
        <div class="eq subeq"><strong>1I-B Section First:</strong> CAR<sub>it</sub> = β₀ + β₁ First_AI_Mention<sub>ist</sub> + γ′T<sub>it</sub> + θ′F<sub>i,t−1</sub> + α<sub>i</sub> + δ<sub>t</sub> + ε<sub>it</sub></div>
        <div class="eq subeq"><strong>1I-C Section Δ:</strong> CAR<sub>it</sub> = β₀ + β₁ Section_ΔAI_Mention<sub>ist</sub> + γ′T<sub>it</sub> + θ′F<sub>i,t−1</sub> + α<sub>i</sub> + δ<sub>t</sub> + ε<sub>it</sub></div>
      </div>
      <div class="model-card current"><div class="model-label"><strong>Model 1J · Start / Stop Decomposition</strong><span class="badge">core transition model</span></div><div class="eq">CAR<sub>it</sub> = β₀ + β<sub>S</sub>StartAI<sub>it</sub> + β<sub>T</sub>StopAI<sub>it</sub> + γ′T<sub>it</sub> + θ′F<sub>i,t−1</sub> + α<sub>i</sub> + δ<sub>t</sub> + ε<sub>it</sub></div><p class="model-note">Reference = NoChange(0→0 또는 1→1).</p></div>
      <div class="model-card current"><div class="model-label"><strong>Model 1K · Start / Stop × AI Focus</strong><span class="badge">intensity interaction</span></div><div class="eq">CAR<sub>it</sub> = β₀ + β₁StartAI<sub>it</sub> + β₂StopAI<sub>it</sub> + β₃AI_Focus<sub>it</sub> + β₄AI_Focus<sub>i,t−1</sub> + β₅(StartAI<sub>it</sub>×AI_Focus<sub>it</sub>) + β₆(StopAI<sub>it</sub>×AI_Focus<sub>i,t−1</sub>) + γ′T<sub>it</sub> + θ′F<sub>i,t−1</sub> + α<sub>i</sub> + δ<sub>t</sub> + ε<sub>it</sub></div></div>
      <div class="model-card current"><div class="model-label"><strong>Model 1L · Section Disclosure Change × AI-language</strong><span class="badge">current moderation model</span></div>
        <div class="eq subeq"><strong>Start (0→1 vs 1→1):</strong> CAR<sub>it</sub> = β₀ + β₁StartAI<sub>ist</sub> + β₂M<sub>ist</sub> + β₃(StartAI<sub>ist</sub>×M<sub>ist</sub>) + γ′T<sub>it</sub> + θ′F<sub>i,t−1</sub> + α<sub>i</sub> + δ<sub>t</sub> + ε<sub>it</sub></div>
        <div class="eq subeq"><strong>Stop (1→0 vs 1→1):</strong> CAR<sub>it</sub> = β₀ + β₁StopAI<sub>ist</sub> + β₂M<sub>is,t−1</sub> + β₃(StopAI<sub>ist</sub>×M<sub>is,t−1</sub>) + γ′T<sub>it</sub> + θ′F<sub>i,t−1</sub> + α<sub>i</sub> + δ<sub>t</sub> + ε<sub>it</sub></div>
        <p class="model-note">M = Concreteness_AI, FutureFocus_AI, PastFocus_AI를 각각 별도 family로 추정. Reference = Stay1(1→1).</p>
      </div>
`;
    const variables=doc.querySelector('#variables');
    if(variables && variables.nextSibling) variables.parentNode.insertBefore(models,variables.nextSibling); else variables?.parentNode.appendChild(models);

    const descriptive=doc.createElement('section');descriptive.id='descriptive';descriptive.className='report-section';descriptive.innerHTML=`

      <div class="desc-banner"><strong>Step 3 반영.</strong> 기술통계는 raw 11,050건을 그대로 혼합하지 않고, OLS 계약과 동일하게 2026 filing 394건을 제외한 뒤 중복 firm-year audit를 통과한 <strong>10,135개 regression-spine firm-year</strong>를 기본 표본으로 사용한다. 변수별 결측을 임의 대체하지 않으므로 N은 변수마다 다르다.</div>
      <div class="audit-grid">
        <div><strong>Raw master</strong><span>11,050</span></div>
        <div><strong>2026 filing 제외</strong><span>10,656</span></div>
        <div><strong>Regression spine</strong><span>10,135</span></div>
        <div><strong>Transition eligible</strong><span>9,082</span></div>

><td>Item 8 — PastFocus_AI</td><td>1,666</td><td>1.1572</td><td>1.6747</td><td>0.0000</td><td>0.0000</td><td>8.7912</td></tr><tr><td>Item 1 — FutureFocus_AI</td><td>2,265</td><td>0.1302</td><td>0.5746</td><td>0.0000</td><td>0.0000</td><td>6.2500</td></tr><tr><td>Item 1A — FutureFocus_AI</td><td>3,137</td><td>0.1183</td><td>0.4790</td><td>0.0000</td><td>0.0000</td><td>7.1429</td></tr><tr><td>Item 7 — FutureFocus_AI</td><td>2,308</td><td>0.1640</td><td>0.6152</td><td>0.0000</td><td>0.0000</td><td>7.6923</td></tr><tr><td>Item 8 — FutureFocus_AI</td><td>1,674</td><td>0.1141</td><td>0.5684</td><td>0.0000</td><td>0.0000</td><td>7.6923</td></tr></tbody>

    if(models.nextSibling) models.parentNode.insertBefore(descriptive,models.nextSibling); else models.parentNode.appendChild(descriptive);

    document.open();document.write('<!doctype html>'+doc.documentElement.outerHTML);document.close();
  }catch(e){document.getElementById('loader').innerHTML='<h1>보고서를 표시할 수 없습니다.</h1><pre>'+String(e)+'</pre>';}
})();
</script>
</body>
</html>
