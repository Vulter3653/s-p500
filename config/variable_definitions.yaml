# 웹 연구 보고서용 변수 메타데이터. 수치는 저장하지 않으며, 생성기는 실제 패널 열과 코드 경로를 검증한다.
company_id:
  display_name: "기업 안정 식별자"
  group: "Identification"
  analysis_level: "Firm-year identifier"
  definition: "CIK 기반으로 연도별 firm-year를 연결하는 안정 기업 식별자이다. 회사명과 ticker가 변해도 패널 결합의 우선 키로 사용한다."
  conceptual_meaning: "동일 발행인의 여러 보고연도를 연결한다."
  operationalization: "패널 생성기에서 CIK 기반 company_id를 사용하며 company_id + report_year의 유일성을 검증한다."
  formula: "company_id = stable identifier assigned from CIK"
  numerator: "Not applicable"
  denominator: "Not applicable"
  unit: "String identifier"
  token_rule: "Not applicable"
  sentence_rule: "Not applicable"
  method: "SEC CIK identity mapping"
  preprocessing: "String-preserved; no numeric arithmetic"
  missing_rule: "Missing identifier is a quality failure, not zero."
  zero_rule: "Not applicable"
  conditional_sample: "All firm-year observations"
  source_columns: [company_id]
  source_dataset: "analysis/descriptive_2020_2025/firm_year_language_extended.csv"
  source_scripts: [scripts/build_2020_2025_language_panel.py]
  validation_rule: "company_id + report_year duplicate count = 0"
  interpretation: "Longitudinal firm key."
  limitation: "Corporate succession or legal issuer changes may require manual identity review."
  aliases: []

report_year:
  display_name: "보고연도"
  group: "Identification"
  analysis_level: "Firm-year identifier"
  definition: "10-K의 reportDate 연도이며 filing year와 구분되는 연구 시간축이다."
  conceptual_meaning: "보고서가 다루는 회계연도의 연도이다."
  operationalization: "SEC filing metadata의 report_date에서 연도를 추출한다."
  formula: "report_year = year(report_date)"
  numerator: "Not applicable"
  denominator: "Not applicable"
  unit: "Calendar year"
  token_rule: "Not applicable"
  sentence_rule: "Not applicable"
  method: "SEC filing metadata"
  preprocessing: "Integer cast after date validation"
  missing_rule: "Missing report year is invalid."
  zero_rule: "Zero is invalid."
  conditional_sample: "All firm-year observations"
  source_columns: [report_year]
  source_dataset: "analysis/descriptive_2020_2025/firm_year_language_extended.csv"
  source_scripts: [scripts/build_2020_2025_language_panel.py]
  validation_rule: "Values must be in 2020–2025."
  interpretation: "Research year."
  limitation: "It is not necessarily the SEC filing submission year."
  aliases: []

ai_disclosure:
  display_name: "AI 공시 여부"
  group: "AI Communication"
  analysis_level: "Firm-year"
  definition: "10-K 분석 본문에서 AI 관련 키워드를 포함한 비중복 AI 관련 문장이 한 개 이상 확인되면 1, 확인되지 않으면 0으로 표시하는 이진 변수이다. 실제 AI 도입이 아니라 문서에서 관찰된 AI 관련 공시의 대리 측정치이다."
  conceptual_meaning: "기업 보고서에 AI 관련 공시가 나타났는지를 측정한다."
  operationalization: "기존 ai_disclosure_flag를 보존하고 ai_sentence_count >= 1이면 1, 0이면 0으로 표준 별칭을 연결한다."
  formula: "AI Disclosureᵢₜ = 1(ai_sentence_countᵢₜ ≥ 1)"
  numerator: "AI direct sentence count ≥ 1"
  denominator: "해당 없음"
  unit: "Binary indicator"
  token_rule: "AI dictionary boundary matching in cleaned analysis text"
  sentence_rule: "A sentence is direct AI-related when the existing AI matcher finds a non-overlapping dictionary match."
  method: "Existing AI matcher and full-sample language pipeline"
  preprocessing: "Existing cleaned sentence text and case-insensitive boundary matching"
  missing_rule: "Source missing remains missing."
  zero_rule: "No AI direct sentence = 0."
  conditional_sample: "All firm-year observations; AI-level measures are conditional on ai_disclosure = 1."
  source_columns: [ai_disclosure, ai_disclosure_flag, ai_sentence_count]
  source_dataset: "analysis/descriptive_2020_2025/firm_year_language_extended.csv"
  source_scripts: [scripts/language_measurement_common.py, scripts/run_language_full_sample.py, scripts/build_extended_language_panel.py]
  validation_rule: "ai_disclosure equals 1 exactly when ai_sentence_count >= 1, subject to source missing."
  interpretation: "Presence of AI-related communication in the filing."
  limitation: "Keyword matching does not establish actual AI implementation or adoption."
  aliases: [ai_disclosure_flag, ai_disclosure_binary]

ai_sentence_count:
  display_name: "AI 관련 문장 수"
  group: "AI Communication"
  analysis_level: "Firm-year and AI direct sentences"
  definition: "기존 AI matcher가 추출한 비중복 AI 관련 문장의 기업-연도별 개수이다. 전체 표본 평균은 AI 관련 공시가 없는 기업-연도의 0을 포함한다."
  conceptual_meaning: "문서에 관찰된 AI 관련 공시의 문장 수준 빈도이다."
  operationalization: "AI 관련 문장 행을 company_id와 accession으로 그룹화해 개수를 센다."
  formula: "AI Sentence Countᵢₜ = Σₛ 1(sentence s contains a non-overlapping AI match)"
  numerator: "Count of matched AI direct sentences"
  denominator: "해당 없음"
  unit: "Sentences"
  token_rule: "Existing AI dictionary and word-boundary matcher"
  sentence_rule: "Existing sentence segmentation; each qualifying sentence counted once regardless of multiple matches."
  method: "scripts/run_language_full_sample.py"
  preprocessing: "Cleaned analysis text; overlapping term matches are resolved by existing matcher."
  missing_rule: "Source missing remains missing."
  zero_rule: "No qualifying sentence = 0."
  conditional_sample: "All firm-year observations"
  source_columns: [ai_sentence_count]
  source_dataset: "analysis/descriptive_2020_2025/firm_year_language_extended.csv"
  source_scripts: [scripts/language_measurement_common.py, scripts/run_language_full_sample.py]
  validation_rule: "Non-negative integer; sum agrees with AI sentence detail files where available."
  interpretation: "Textual AI communication intensity, not adoption."
  limitation: "Counts depend on dictionary coverage, sentence extraction and reporting style."
  aliases: [log1p_ai_sentence_count, ai_sentence_count_lag1, ai_sentence_count_change]

ai_sentence_ratio:
  display_name: "AI 문장 비율"
  group: "AI Communication"
  analysis_level: "Firm-year"
  definition: "AI 직접 문장 수를 전체 유효 분석 문장 수로 나눈 비율이다."
  conceptual_meaning: "보고서 문장 중 AI 관련 문장이 차지하는 비중이다."
  operationalization: "ai_sentence_count를 total_analysis_sentence_count로 나눈 기존 ratio를 사용한다."
  formula: "AI Sentence Ratioᵢₜ = AI Direct Sentence Countᵢₜ / Total Eligible Sentence Countᵢₜ"
  numerator: "ai_sentence_count"
  denominator: "total_analysis_sentence_count"
  unit: "Proportion"
  token_rule: "Not applicable beyond source sentence count"
  sentence_rule: "Eligible analysis sentences from existing extraction pipeline"
  method: "Existing full-sample language pipeline"
  preprocessing: "No remeasurement; source ratio copied"
  missing_rule: "Missing when source denominator is unavailable."
  zero_rule: "Zero AI sentences yield zero when denominator is positive."
  conditional_sample: "All firm-year observations"
  source_columns: [ai_sentence_ratio, ai_sentence_count, total_analysis_sentence_count]
  source_dataset: "analysis/descriptive_2020_2025/firm_year_language_extended.csv"
  source_scripts: [scripts/run_language_full_sample.py]
  validation_rule: "Non-negative and within [0, 1] when non-missing."
  interpretation: "Relative AI sentence intensity."
  limitation: "Sensitive to section extraction and total sentence denominator."
  aliases: []

whole_report_concreteness:
  display_name: "전체 보고서 구체성"
  group: "Concreteness"
  analysis_level: "Whole 10-K report"
  definition: "SMART stopword 제거 후 Brysbaert concreteness lexicon에 유효하게 매칭된 전체 보고서 token의 평균 점수이다. exact match를 우선하고 unique Porter stem fallback을 사용하며 ambiguous collision은 제외한다."
  conceptual_meaning: "보고서 어휘가 감각적으로 구체적인 정도를 요약한다."
  operationalization: "report_concreteness_mean을 표준 별칭으로 연결하며 기존 점수를 재계산하지 않는다."
  formula: "Concretenessᵢₜ = Σⱼ Ratingⱼ / Matched Eligible Token Countᵢₜ"
  numerator: "Matched token concreteness ratings summed over valid matches"
  denominator: "report_concreteness_matched_token_count"
  unit: "Brysbaert rating score"
  token_rule: "Alphabetic eligible tokens after SMART stopword removal"
  sentence_rule: "All included analysis sentences"
  method: "Brysbaert lexicon; Porter stemming; exact then unique-stem fallback"
  preprocessing: "Lowercase, SMART removal, Porter stemming; collision stems excluded"
  missing_rule: "Missing when no valid matched token denominator exists."
  zero_rule: "No valid matched token is structural missing, not zero score."
  conditional_sample: "All firm-year observations with valid report matches"
  source_columns: [whole_report_concreteness, report_concreteness_mean, report_concreteness_matched_token_count, report_concreteness_coverage]
  source_dataset: "analysis/descriptive_2020_2025/firm_year_language_extended.csv"
  source_scripts: [scripts/measure_linguistic_concreteness.py, scripts/build_extended_language_panel.py]
  validation_rule: "Coverage is within [0, 1]; collision counts retained."
  interpretation: "Higher score indicates more concrete matched vocabulary under the lexicon."
  limitation: "Lexicon coverage and contextual meaning may not capture document-level abstraction."
  aliases: [report_concreteness_mean]

ai_concreteness:
  display_name: "AI 관련 문장 구체성"
  group: "Concreteness"
  analysis_level: "AI direct sentences"
  definition: "AI 직접 문장에 포함된 유효 token 중 Brysbaert 점수가 매칭된 token의 평균이다. AI 문장이 없는 firm-year에는 유효한 AI 분모가 없으므로 결측이다."
  conceptual_meaning: "AI 관련 문장의 어휘적 구체성이다."
  operationalization: "ai_concreteness_mean을 표준 별칭으로 연결한다."
  formula: "AI Concretenessᵢₜ = Σⱼ AI Matched Ratingⱼ / AI Matched Token Countᵢₜ"
  numerator: "AI matched token ratings"
  denominator: "ai_concreteness_matched_token_count"
  unit: "Brysbaert rating score"
  token_rule: "AI sentence eligible alphabetic tokens after SMART removal"
  sentence_rule: "Existing AI direct sentence rows only"
  method: "Brysbaert lexicon with exact and unique-stem fallback"
  preprocessing: "Same as whole-report concreteness; collision excluded"
  missing_rule: "AI sentence count zero or valid denominator zero => missing."
  zero_rule: "No AI sentence is not treated as zero concreteness."
  conditional_sample: "AI disclosure firm-years only"
  source_columns: [ai_concreteness, ai_concreteness_mean, ai_concreteness_matched_token_count, ai_concreteness_coverage]
  source_dataset: "analysis/descriptive_2020_2025/firm_year_language_extended.csv"
  source_scripts: [scripts/measure_linguistic_concreteness.py]
  validation_rule: "AI coverage within [0, 1]; N reflects valid AI-level observations."
  interpretation: "Higher score indicates more concrete matched AI vocabulary."
  limitation: "Conditional sample and sparse AI text can make the mean unstable."
  aliases: [ai_concreteness_mean]

lm_uncertainty_share:
  display_name: "Loughran–McDonald uncertainty 비율"
  group: "Loughran–McDonald"
  analysis_level: "Whole 10-K report"
  definition: "Loughran–McDonald financial dictionary의 Uncertainty 범주에 일치한 유효 token 수를 전체 유효 Loughran–McDonald token 수로 나눈 상대 비중이다. 심리 상태가 아니라 금융공시 어휘의 비중이다."
  conceptual_meaning: "보고서에서 uncertainty 범주 어휘가 차지하는 비중이다."
  operationalization: "report_uncertainty_ratio를 표준 별칭으로 연결한다."
  formula: "Loughran–McDonald Uncertainty Shareᵢₜ = Uncertainty Token Countᵢₜ / Eligible Loughran–McDonald Token Countᵢₜ"
  numerator: "report_uncertainty_count"
  denominator: "report_total_eligible_word_count"
  unit: "Proportion"
  token_rule: "기존 Loughran–McDonald 적격 tokenization 및 normalization 규칙"
  sentence_rule: "All included report sentences"
  method: "Loughran–McDonald Master Dictionary"
  preprocessing: "Existing lowercase/token normalization; category active rules"
  missing_rule: "Source missing or denominator zero remains missing."
  zero_rule: "Zero category matches with positive denominator = 0."
  conditional_sample: "All valid report-level observations"
  source_columns: [lm_uncertainty_share, report_uncertainty_ratio, report_uncertainty_count, report_total_eligible_word_count]
  source_dataset: "analysis/descriptive_2020_2025/firm_year_language_extended.csv"
  source_scripts: [scripts/run_language_full_sample.py, scripts/build_extended_language_panel.py]
  validation_rule: "Non-missing proportion within [0, 1]."
  interpretation: "Loughran–McDonald uncertainty 어휘의 상대적 사용 비중이다."
  limitation: "Dictionary matching ignores local syntax, negation and polysemy."
  aliases: [ai_lm_uncertainty_share]

past_tense_share:
  display_name: "과거 시제 비율"
  group: "Tense"
  analysis_level: "Whole 10-K report"
  definition: "spaCy POS 결과에서 VBD로 분류된 동사 수를 past, present, future 시제 count 합으로 나눈 비율이다."
  conceptual_meaning: "분류 가능한 시제 표지 중 과거 시제의 상대 비중이다."
  operationalization: "measure_extended_language_features.py의 tense count와 finite_verb_count를 사용한다."
  formula: "Past Shareᵢₜ = Past Countᵢₜ / (Past + Present + Future Count)ᵢₜ"
  numerator: "past_tense_count (VBD)"
  denominator: "finite_verb_count"
  unit: "Proportion"
  token_rule: "spaCy token/POS output"
  sentence_rule: "spaCy sentence segmentation over analysis text"
  method: "spaCy 3.8.7 with en_core_web_sm 3.8.0"
  preprocessing: "Existing cleaned text, chunked NLP processing"
  missing_rule: "Denominator zero => missing."
  zero_rule: "Zero count retained when denominator is positive."
  conditional_sample: "All firm-year observations with finite-verb denominator"
  source_columns: [past_tense_share, past_tense_count, finite_verb_count]
  source_dataset: "analysis/descriptive_2020_2025/firm_year_language_extended.csv"
  source_scripts: [scripts/measure_extended_language_features.py]
  validation_rule: "Share within [0, 1]; tense counts non-negative."
  interpretation: "Relative past-tense marker share, not narrative temporality in full."
  limitation: "POS tagging and finite-verb rules can misclassify complex constructions."
  aliases: [ai_past_tense_share]

present_tense_share:
  display_name: "현재 시제 비율"
  group: "Tense"
  analysis_level: "Whole 10-K report"
  definition: "spaCy POS 결과에서 VBP 또는 VBZ로 분류된 동사 수를 세 시제 count 합으로 나눈 비율이다."
  conceptual_meaning: "분류 가능한 시제 표지 중 현재 시제의 상대 비중이다."
  operationalization: "VBP/VBZ count divided by finite_verb_count."
  formula: "Present Shareᵢₜ = Present Countᵢₜ / (Past + Present + Future Count)ᵢₜ"
  numerator: "present_tense_count (VBP + VBZ)"
  denominator: "finite_verb_count"
  unit: "Proportion"
  token_rule: "spaCy POS tokens"
  sentence_rule: "spaCy sentence segmentation"
  method: "spaCy 3.8.7 en_core_web_sm 3.8.0"
  preprocessing: "Existing cleaned text and chunk processing"
  missing_rule: "Denominator zero => missing."
  zero_rule: "Zero count retained when denominator is positive."
  conditional_sample: "All firm-year observations with finite-verb denominator"
  source_columns: [present_tense_share, present_tense_count, finite_verb_count]
  source_dataset: "analysis/descriptive_2020_2025/firm_year_language_extended.csv"
  source_scripts: [scripts/measure_extended_language_features.py]
  validation_rule: "Share within [0, 1]."
  interpretation: "Relative present-tense marker share."
  limitation: "Not a comprehensive measure of present-oriented managerial language."
  aliases: [ai_present_tense_share]

future_tense_share:
  display_name: "미래 시제 비율"
  group: "Tense"
  analysis_level: "Whole 10-K report"
  definition: "will, shall, 'll 미래 보조 표지 count를 세 시제 count 합으로 나눈 제한적 미래 시제 지표이다. plan to, intend to, expect to, aim to, anticipate, be going to는 포함하지 않는다."
  conceptual_meaning: "제한된 미래 조동사 표지의 상대 비중이다."
  operationalization: "Future marker count from existing spaCy/lemma rule divided by finite_verb_count."
  formula: "Future Shareᵢₜ = Future Marker Countᵢₜ / (Past + Present + Future Count)ᵢₜ"
  numerator: "future_tense_count (will/shall/'ll markers)"
  denominator: "finite_verb_count"
  unit: "Proportion"
  token_rule: "Lowercase/lemma rule implemented in measurement script"
  sentence_rule: "spaCy sentence segmentation"
  method: "spaCy 3.8.7 en_core_web_sm 3.8.0"
  preprocessing: "Existing cleaned text and marker matching"
  missing_rule: "Denominator zero => missing."
  zero_rule: "Zero marker count retained when denominator is positive."
  conditional_sample: "All firm-year observations with finite-verb denominator"
  source_columns: [future_tense_share, future_tense_count, finite_verb_count]
  source_dataset: "analysis/descriptive_2020_2025/firm_year_language_extended.csv"
  source_scripts: [scripts/measure_extended_language_features.py]
  validation_rule: "Share within [0, 1]."
  interpretation: "Limited future-modal marker usage, not all future orientation."
  limitation: "Other future-oriented constructions are omitted."
  aliases: [ai_future_tense_share]

passive_voice_sentence_share:
  display_name: "수동태 문장 비율"
  group: "Passive Voice"
  analysis_level: "Whole 10-K report"
  definition: "spaCy dependency parse에서 auxpass 또는 nsubjpass 관계가 하나 이상 있는 문장을 수동태로 표시하고 전체 spaCy 문장 수로 나눈다. 한 문장에 여러 관계가 있어도 한 문장으로 센다."
  conceptual_meaning: "문서 문장 중 dependency 규칙으로 분류된 수동태 문장의 비중이다."
  operationalization: "Sentence-level boolean classification from dependency relations."
  formula: "Passive Shareᵢₜ = Passive Sentence Countᵢₜ / Parsed Sentence Countᵢₜ"
  numerator: "passive_voice_sentence_count"
  denominator: "spacy_sentence_count"
  unit: "Proportion"
  token_rule: "spaCy dependency tokens"
  sentence_rule: "spaCy sentence boundaries"
  method: "spaCy dependency parser; auxpass/nsubjpass"
  preprocessing: "Existing cleaned text and chunked processing"
  missing_rule: "Sentence denominator zero => missing."
  zero_rule: "No passive relation with positive denominator = 0."
  conditional_sample: "All parsed report observations"
  source_columns: [passive_voice_sentence_share, passive_voice_sentence_count, spacy_sentence_count]
  source_dataset: "analysis/descriptive_2020_2025/firm_year_language_extended.csv"
  source_scripts: [scripts/measure_extended_language_features.py]
  validation_rule: "Share within [0, 1]."
  interpretation: "Parser-defined passive sentence prevalence."
  limitation: "Parser errors, reduced clauses and complex coordination can cause false negatives or positives."
  aliases: [ai_passive_voice_sentence_share]

fog_index:
  display_name: "Gunning Fog Index"
  group: "Readability"
  analysis_level: "Whole 10-K report"
  definition: "정제된 분석 텍스트의 유효 단어·문장 수와 결정론적 음절 휴리스틱으로 복잡 단어 비율을 계산해 문장 길이와 결합한 가독성 지수이다."
  conceptual_meaning: "문서의 표면적 언어 복잡성을 요약한다."
  operationalization: "report_fog_index를 표준 별칭으로 연결한다. eligible alphabetic token과 non-empty sentence를 사용한다."
  formula: "Fogᵢₜ = 0.4 × [(Wordsᵢₜ / Sentencesᵢₜ) + 100 × (ComplexWordsᵢₜ / Wordsᵢₜ)]"
  numerator: "Eligible words; words with count_syllables(word) >= 3"
  denominator: "Eligible non-empty sentences; eligible words"
  unit: "Index score"
  token_rule: "language_measurement_common.WORD_RE tokens containing alphabetic characters"
  sentence_rule: "Non-empty extracted analysis sentences"
  method: "scripts/language_measurement_common.py readability()"
  preprocessing: "HTML extraction output; punctuation excluded by WORD_RE; deterministic vowel-group syllable heuristic; terminal e rule"
  missing_rule: "Missing when sentence or word denominator is zero."
  zero_rule: "Zero complex words with positive words = zero complex-word ratio."
  conditional_sample: "All firm-year observations with valid report text"
  source_columns: [fog_index, report_fog_index]
  source_dataset: "analysis/descriptive_2020_2025/firm_year_language_extended.csv"
  source_scripts: [scripts/language_measurement_common.py, scripts/measure_report_level_controls.py]
  validation_rule: "Finite numeric index; source status valid."
  interpretation: "Higher values indicate greater surface complexity under this heuristic."
  limitation: "Does not directly measure information quality; financial/legal terminology can be treated as complex."
  aliases: [report_fog_index, ai_fog_index]

report_word_count:
  display_name: "보고서 유효 단어 수"
  group: "Document Controls"
  analysis_level: "Whole 10-K report"
  definition: "hidden metadata와 제외된 table block을 처리한 분석 텍스트에서 WORD_RE로 추출한 alphabetic-containing token의 수이다."
  conceptual_meaning: "분석 대상 문서의 텍스트 길이이다."
  operationalization: "Existing report_word_count is copied from report-level controls."
  formula: "Wordsᵢₜ = Σₖ 1(token k matches WORD_RE and contains alphabetic character)"
  numerator: "Count of eligible word tokens"
